<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="20%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card Background -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="240" rx="16" fill="url(#grid)" />
  <rect width="900" height="240" rx="16" fill="url(#glowCyan)" />
  <rect width="900" height="240" rx="16" fill="url(#glowPurple)" />

  <!-- Outer Border with Neon Accent -->
  <rect width="898" height="238" x="1" y="1" rx="15" fill="none" stroke="url(#cyanPurple)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Corner Tech Brackets -->
  <path d="M 20 45 L 20 20 L 45 20" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 880 45 L 880 20 L 855 20" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 20 195 L 20 220 L 45 220" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 880 195 L 880 220 L 855 220" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Decorative Circuit Dots & Lines -->
  <circle cx="50" cy="20" r="3" fill="#38bdf8" />
  <circle cx="850" cy="20" r="3" fill="#818cf8" />
  <line x1="60" y1="20" x2="160" y2="20" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4" />
  <line x1="740" y1="20" x2="840" y2="20" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4" />

  <!-- Experience Badge (Top Right) -->
  <g transform="translate(670, 32)">
    <rect width="180" height="34" rx="17" fill="url(#badgeGrad)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="20" cy="17" r="5" fill="#f59e0b" filter="url(#glowFilter)" />
    <text x="34" y="22" fill="url(#goldGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">14+ YEARS EXP</text>
  </g>

  <!-- Left Icon / Avatar Badge -->
  <g transform="translate(45, 55)">
    <rect width="70" height="70" rx="18" fill="url(#badgeGrad)" stroke="url(#cyanPurple)" stroke-width="1.5" />
    <text x="35" y="44" fill="#38bdf8" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="900" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Main Name Header -->
  <text x="135" y="90" fill="url(#cyanPurple)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="1.5" filter="url(#glowFilter)">HUYNH VAN TOAN</text>

  <!-- Subtitle / Title -->
  <text x="135" y="118" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" letter-spacing="1">SENIOR FULLSTACK &amp; MOBILE SDK ARCHITECT</text>

  <!-- Bottom Pills / Tags Row -->
  <g transform="translate(45, 155)">
    <!-- Pill 1: Mobile & SDKs -->
    <g transform="translate(0, 0)">
      <rect width="155" height="32" rx="8" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <text x="77" y="20" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📱 Flutter • Android • iOS</text>
    </g>

    <!-- Pill 2: FinTech & eKYC -->
    <g transform="translate(165, 0)">
      <rect width="150" height="32" rx="8" fill="url(#badgeGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
      <text x="75" y="20" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛡️ FinTech • eKYC SDK</text>
    </g>

    <!-- Pill 3: Backend & Microservices -->
    <g transform="translate(325, 0)">
      <rect width="175" height="32" rx="8" fill="url(#badgeGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
      <text x="87" y="20" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚙️ Java • Spring • MQTT</text>
    </g>

    <!-- Pill 4: Connected Car & IoT -->
    <g transform="translate(510, 0)">
      <rect width="155" height="32" rx="8" fill="url(#badgeGrad)" stroke="#f472b6" stroke-width="1" stroke-opacity="0.4" />
      <text x="77" y="20" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🚗 Connected Car IoT</text>
    </g>

    <!-- Pill 5: DiA Academy -->
    <g transform="translate(675, 0)">
      <rect width="135" height="32" rx="8" fill="url(#badgeGrad)" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.4" />
      <text x="67" y="20" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">👨‍🏫 DiA Mentor</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="45" y1="210" x2="855" y2="210" stroke="url(#cyanPurple)" stroke-width="1.5" stroke-opacity="0.3" />
</svg>
